<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanTrack Pro</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}

/* LOGIN */
#loginScreen {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-card {
  background: #111827;
  padding: 30px;
  border-radius: 16px;
  width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.login-card input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
}

.btn {
  width: 100%;
  padding: 10px;
  border: none;
  background: #6366f1;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* APP */
#app {
  display: none;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  height: 100vh;
  background: #111827;
  padding: 20px;
  position: fixed;
}

.nav-item {
  padding: 10px;
  margin: 6px 0;
  cursor: pointer;
  border-radius: 8px;
}

.nav-item:hover {
  background: #1f2937;
}

/* MAIN */
.main {
  margin-left: 240px;
  padding: 20px;
}

.topbar {
  font-size: 22px;
  margin-bottom: 20px;
}

/* STATS */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 15px;
}

.stat-card {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
}

.stat-label {
  font-size: 12px;
  color: #9ca3af;
}

.stat-value {
  font-size: 22px;
  font-weight: bold;
}

/* COLORS */
.green { color: #22c55e; }
.red { color: #ef4444; }
.gold { color: #f59e0b; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <h2 style="margin-bottom:10px;">💰 LoanTrack Pro</h2>
    <input type="text" id="user" placeholder="Username"/>
    <input type="password" id="pass" placeholder="Password"/>
    <button class="btn" onclick="login()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <h3>💰 LoanTrack</h3>
    <div class="nav-item">Dashboard</div>
    <div class="nav-item">Consumers</div>
    <div class="nav-item">Loans</div>
    <div class="nav-item">Payments</div>
  </aside>

  <main class="main">
    <div class="topbar">Dashboard</div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Loans</div>
        <div class="stat-value">120</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Active Loans</div>
        <div class="stat-value gold">80</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Profit</div>
        <div class="stat-value green">$12,000</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Overdue</div>
        <div class="stat-value red">5</div>
      </div>
    </div>

  </main>
</div>

<script>
function login() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
}
</script>

</body>
</html>
